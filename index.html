<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Task</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="logo.png" type="image/png">
</head>

<body>

    <header class="navbar">
        <div class="logo">My-Task</div>
        <div class="nav-right">
            <div class="clock-box">
                <span id="live-time">00:00:00 AM</span>
                <span id="live-date">Loading date...</span>
            </div>
            <button id="clear-all-btn" class="btn-clear-all" title="Reset all dashboard data">Clear Data</button>
        </div>
    </header>

    <main class="container">
        <section class="quote-card">
            <p id="quote-text">Loading quote...</p>
        </section>

        <section class="widgets-grid">

            <div class="card">
                <div class="card-header">
                    <h2>Sticky Notes</h2>
                </div>
                <div class="card-body">
                    <div class="input-row">
                        <input type="text" id="note-input" placeholder="Type a note...">
                        <button id="add-note-btn">Add</button>
                    </div>
                    <ul id="notes-list" class="list"></ul>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>To-Do List</h2>
                </div>
                <div class="card-body">
                    <div class="input-row">
                        <input type="text" id="todo-input" placeholder="New task...">
                        <button id="add-todo-btn">Add</button>
                    </div>
                    <ul id="todo-list" class="list"></ul>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>Bookmarks</h2>
                </div>
                <div class="card-body">
                    <div class="input-stack">
                        <input type="text" id="bm-title" placeholder="Title">
                        <input type="url" id="bm-url" placeholder="URL">
                        <button id="add-bm-btn">Add Bookmark</button>
                    </div>
                    <ul id="bookmarks-list" class="list"></ul>
                </div>
            </div>

        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
